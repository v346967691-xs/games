<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>剧情分镜 GPT 指令生成器</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            background: #f5f1e8;
            color: #22312f;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        button, textarea, select { font: inherit; }
        button {
            border: 0;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 800;
        }
        textarea, select {
            width: 100%;
            border: 1px solid #c9c1b3;
            border-radius: 6px;
            background: #fffdf8;
            color: #22312f;
            padding: 11px 12px;
            outline: none;
        }
        textarea:focus, select:focus {
            border-color: #1f8a8a;
            box-shadow: 0 0 0 3px rgba(31, 138, 138, 0.14);
        }
        textarea {
            min-height: 190px;
            resize: vertical;
            line-height: 1.6;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #53615e;
            font-size: 13px;
            font-weight: 900;
        }
        .app {
            min-height: 100vh;
            display: grid;
            grid-template-columns: minmax(330px, 440px) minmax(0, 1fr);
        }
        .input-panel {
            padding: 24px;
            background: #fffaf0;
            border-right: 1px solid #ded5c7;
        }
        .output-panel { padding: 24px; }
        h1 {
            margin: 0;
            font-size: 25px;
            letter-spacing: 0;
        }
        .subtitle {
            margin: 6px 0 22px;
            color: #66716e;
            font-size: 14px;
            line-height: 1.45;
        }
        .field { margin-bottom: 16px; }
        .grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
        }
        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
        }
        .btn-primary {
            background: #1f8a8a;
            color: #fff;
            padding: 12px 16px;
        }
        .btn-primary:hover { background: #176f6f; }
        .btn-dark {
            background: #22312f;
            color: #fff;
            padding: 12px 16px;
        }
        .btn-soft {
            background: #e6daca;
            color: #22312f;
            padding: 12px 16px;
        }
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-bottom: 16px;
        }
        .output {
            width: 100%;
            min-height: calc(100vh - 138px);
            border: 1px solid #162422;
            border-radius: 8px;
            background: #162422;
            color: #f3f7ef;
            font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
            font-size: 13px;
            line-height: 1.65;
            padding: 16px;
        }
        .status {
            min-height: 20px;
            margin-top: 12px;
            color: #197474;
            font-size: 13px;
            font-weight: 800;
        }
        @media (max-width: 860px) {
            .app { display: block; }
            .input-panel {
                border-right: 0;
                border-bottom: 1px solid #ded5c7;
            }
            .grid { grid-template-columns: 1fr; }
            .topbar {
                align-items: stretch;
                flex-direction: column;
            }
            .actions button { flex: 1; }
            .output { min-height: 520px; }
        }
    </style>
</head>
<body>
    <div class="app">
        <section class="input-panel">
            <h1>剧情分镜 GPT 指令生成器</h1>
            <div class="subtitle">这个页面不在本地伪造 AI 内容，而是把你的输入整理成一段完整指令。复制右侧内容到 GPT，GPT 会按你的剧情生成真正的分镜脚本和 image-2 出图提示词。</div>

            <div class="field">
                <label for="summary">剧情概要</label>
                <textarea id="summary" placeholder="自由编辑。写清楚角色、场景、冲突、情绪、结尾。例如：一个外卖员在暴雨夜送最后一单，发现收货人是多年未见的母亲，两人在门口短暂和解。"></textarea>
            </div>

            <div class="grid">
                <div class="field">
                    <label for="duration">时长</label>
                    <select id="duration"></select>
                </div>
                <div class="field">
                    <label for="ratio">视频横竖屏比例</label>
                    <select id="ratio">
                        <option value="9:16 竖屏短视频">9:16 竖屏短视频</option>
                        <option value="16:9 横屏视频">16:9 横屏视频</option>
                        <option value="1:1 方形视频">1:1 方形视频</option>
                        <option value="4:5 信息流竖图">4:5 信息流竖图</option>
                    </select>
                </div>
                <div class="field">
                    <label for="voiceover">是否需要配音</label>
                    <select id="voiceover">
                        <option value="需要配音">需要配音</option>
                        <option value="不需要配音">不需要配音</option>
                    </select>
                </div>
                <div class="field">
                    <label for="subtitles">是否需要字幕</label>
                    <select id="subtitles">
                        <option value="需要字幕">需要字幕</option>
                        <option value="不需要字幕">不需要字幕</option>
                    </select>
                </div>
            </div>

            <div class="actions">
                <button class="btn-primary" id="generateBtn">生成 GPT 创作指令</button>
                <button class="btn-soft" id="sampleBtn">填入示例</button>
                <button class="btn-dark" id="clearBtn">清空</button>
            </div>
            <div class="status" id="status"></div>
        </section>

        <section class="output-panel">
            <div class="topbar">
                <div>
                    <h1>GPT 创作指令</h1>
                    <div class="subtitle">复制到 GPT 后，让 GPT 按你的输入生成完整分镜、台词、音效、字幕和 image-2 出图提示词。</div>
                </div>
                <div class="actions">
                    <button class="btn-primary" id="copyBtn">复制</button>
                    <button class="btn-soft" id="downloadBtn">下载 TXT</button>
                </div>
            </div>
            <textarea class="output" id="output" spellcheck="false"></textarea>
        </section>
    </div>

    <script>
        const durationEl = document.getElementById('duration');
        const summaryEl = document.getElementById('summary');
        const outputEl = document.getElementById('output');
        const statusEl = document.getElementById('status');

        for (let seconds = 5; seconds <= 15; seconds++) {
            const option = document.createElement('option');
            option.value = String(seconds);
            option.textContent = `${seconds} 秒`;
            if (seconds === 10) option.selected = true;
            durationEl.appendChild(option);
        }

        function showStatus(text) {
            statusEl.textContent = text;
            clearTimeout(showStatus.timer);
            showStatus.timer = setTimeout(() => statusEl.textContent = '', 1800);
        }

        function splitIntoShots(duration) {
            if (duration <= 6) return 3;
            if (duration <= 9) return 4;
            if (duration <= 12) return 5;
            return 6;
        }

        function getShotPlan(count, duration) {
            const base = Math.floor(duration / count);
            const extra = duration % count;
            let start = 0;
            return Array.from({ length: count }, (_, index) => {
                const length = base + (index < extra ? 1 : 0);
                const shot = { index: index + 1, start, end: start + length };
                start += length;
                return shot;
            });
        }

        function buildShotTask(index, count) {
            const tasks = [
                ['建立场景', '交代故事发生地点、时间、氛围和主角处境。'],
                ['人物登场', '突出主角外观、状态、标志物和当前情绪。'],
                ['冲突出现', '呈现让故事发生变化的动作、信息、阻碍或关系变化。'],
                ['情绪转折', '让人物做出选择，情绪从一种状态转向另一种状态。'],
                ['结果揭示', '给出结局画面或悬念，让观众理解这一段故事的落点。'],
                ['余韵收束', '用一个安静但明确的画面结束，留下记忆点。']
            ];
            if (count === 3) return [tasks[0], tasks[2], tasks[4]][index - 1];
            if (count === 4) return [tasks[0], tasks[1], tasks[3], tasks[4]][index - 1];
            if (count === 5) return tasks.slice(0, 5)[index - 1];
            return tasks[index - 1];
        }

        function generatePrompt() {
            const summary = summaryEl.value.trim() || '请在这里补充剧情概要。';
            const duration = Number(durationEl.value);
            const ratio = document.getElementById('ratio').value;
            const voiceover = document.getElementById('voiceover').value;
            const subtitles = document.getElementById('subtitles').value;
            const shotCount = splitIntoShots(duration);
            const shotPlan = getShotPlan(shotCount, duration);
            const shotGuide = shotPlan.map((shot) => {
                const [title, task] = buildShotTask(shot.index, shotCount);
                return `镜头 ${String(shot.index).padStart(2, '0')}｜${shot.start}-${shot.end} 秒｜${title}：${task}`;
            }).join('\n');

            outputEl.value = [
                '你是一名短视频导演、分镜师和 image-2 提示词工程师。请严格根据我提供的输入，创作一份可直接用于出图和制作视频的剧情分镜脚本。',
                '',
                '【我的输入】',
                `剧情概要：${summary}`,
                `时长：${duration} 秒`,
                `视频横竖屏比例：${ratio}`,
                `是否需要配音：${voiceover}`,
                `是否需要字幕：${subtitles}`,
                '',
                '【创作规则】',
                `1. 把剧情拆成 ${shotCount} 个镜头，总时长控制在 ${duration} 秒。`,
                '2. 必须完全围绕剧情概要展开，不要另起新故事，不要添加无关人物、无关场景或无关道具。',
                '3. 如果剧情概要没有写清人物外貌，请合理补足，但必须简洁、现实、稳定，并在所有镜头中保持一致。',
                '4. 每个镜头只表现一个能被画成单张图的关键瞬间，不要把连续动作塞进同一张 image-2 提示词。',
                `5. 所有画面都遵守视频比例：${ratio}。`,
                voiceover === '需要配音'
                    ? '6. 需要配音：每个镜头写一句短配音，语气自然、有情绪，不要解释画面。'
                    : '6. 不需要配音：配音栏统一写“无”。',
                subtitles === '需要字幕'
                    ? '7. 需要字幕：每个镜头写一句 6-16 字短字幕，适合短视频画面展示。'
                    : '7. 不需要字幕：字幕栏统一写“无”。',
                '8. 台词必须符合人物处境，能不说就不说，不要写空泛鸡汤。',
                '9. 音效要具体，写环境音和动作音，例如雨声、脚步声、门铃声、衣料摩擦声、呼吸声。',
                '10. image-2 出图提示词必须包含：主体、动作、环境、景别、机位、构图、光线、色彩、情绪、画面比例、风格一致性。',
                '',
                '【建议镜头结构】',
                shotGuide,
                '',
                '【请按这个格式输出】',
                '一、人物设定',
                '- 主角：身份、年龄感、外貌、服装、标志物、表情气质',
                '- 配角：身份、外貌、服装、与主角关系',
                '- 场景设定：地点、时间、光线、色彩、氛围',
                '- 统一风格：写实/电影感/动画感等，并说明如何保持一致',
                '',
                '二、分镜脚本',
                '镜头 01｜0-? 秒｜镜头标题',
                '分段剧情描述：',
                '画面内容：',
                '镜头语言：景别、机位、构图、运动、光线、色彩、情绪',
                '台词：',
                '配音：',
                '音效：',
                '字幕：',
                'image-2 出图提示词：',
                '',
                '请继续输出后续所有镜头，直到总时长结束。',
                '',
                '三、image-2 提示词汇总',
                '最后把每个镜头的 image-2 出图提示词单独列出来，方便我逐条复制出图。'
            ].join('\n');
            showStatus(`已生成 GPT 指令：${shotCount} 个镜头`);
        }

        async function copyOutput() {
            try {
                await navigator.clipboard.writeText(outputEl.value);
                showStatus('已复制');
            } catch (error) {
                outputEl.select();
                document.execCommand('copy');
                showStatus('已复制');
            }
        }

        function loadSample() {
            summaryEl.value = '一个年轻女孩在深夜便利店躲雨，偶遇多年未联系的哥哥。两人一开始尴尬沉默，后来因为一盒热牛奶想起童年，关系慢慢缓和，最后哥哥把伞递给她，自己走进雨里。';
            durationEl.value = '12';
            document.getElementById('ratio').value = '9:16 竖屏短视频';
            document.getElementById('voiceover').value = '需要配音';
            document.getElementById('subtitles').value = '需要字幕';
            generatePrompt();
        }

        function clearAll() {
            summaryEl.value = '';
            durationEl.value = '10';
            document.getElementById('ratio').value = '9:16 竖屏短视频';
            document.getElementById('voiceover').value = '需要配音';
            document.getElementById('subtitles').value = '需要字幕';
            outputEl.value = '';
            showStatus('已清空');
        }

        function downloadOutput() {
            const blob = new Blob([outputEl.value], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'storyboard-gpt-instruction.txt';
            link.click();
            URL.revokeObjectURL(url);
        }

        document.getElementById('generateBtn').addEventListener('click', generatePrompt);
        document.getElementById('sampleBtn').addEventListener('click', loadSample);
        document.getElementById('clearBtn').addEventListener('click', clearAll);
        document.getElementById('copyBtn').addEventListener('click', copyOutput);
        document.getElementById('downloadBtn').addEventListener('click', downloadOutput);

        generatePrompt();
    </script>
</body>
</html>
