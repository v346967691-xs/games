<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>剧情分镜提示词生成器</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            background: #f5f1e8;
            color: #22312f;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        button, textarea, select {
            font: inherit;
        }
        button {
            border: 0;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 800;
        }
        textarea, select {
            width: 100%;
            border: 1px solid #c9c1b3;
            border-radius: 6px;
            background: #fffdf8;
            color: #22312f;
            padding: 11px 12px;
            outline: none;
        }
        textarea:focus, select:focus {
            border-color: #1f8a8a;
            box-shadow: 0 0 0 3px rgba(31, 138, 138, 0.14);
        }
        textarea {
            min-height: 190px;
            resize: vertical;
            line-height: 1.6;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #53615e;
            font-size: 13px;
            font-weight: 900;
        }
        .app {
            min-height: 100vh;
            display: grid;
            grid-template-columns: minmax(330px, 440px) minmax(0, 1fr);
        }
        .input-panel {
            padding: 24px;
            background: #fffaf0;
            border-right: 1px solid #ded5c7;
        }
        .output-panel {
            padding: 24px;
        }
        h1 {
            margin: 0;
            font-size: 25px;
            letter-spacing: 0;
        }
        .subtitle {
            margin: 6px 0 22px;
            color: #66716e;
            font-size: 14px;
        }
        .field {
            margin-bottom: 16px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
        }
        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
        }
        .btn-primary {
            background: #1f8a8a;
            color: #fff;
            padding: 12px 16px;
        }
        .btn-primary:hover { background: #176f6f; }
        .btn-dark {
            background: #22312f;
            color: #fff;
            padding: 12px 16px;
        }
        .btn-soft {
            background: #e6daca;
            color: #22312f;
            padding: 12px 16px;
        }
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-bottom: 16px;
        }
        .output {
            width: 100%;
            min-height: calc(100vh - 138px);
            border: 1px solid #162422;
            border-radius: 8px;
            background: #162422;
            color: #f3f7ef;
            font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
            font-size: 13px;
            line-height: 1.65;
            padding: 16px;
        }
        .status {
            min-height: 20px;
            margin-top: 12px;
            color: #197474;
            font-size: 13px;
            font-weight: 800;
        }
        @media (max-width: 860px) {
            .app {
                display: block;
            }
            .input-panel {
                border-right: 0;
                border-bottom: 1px solid #ded5c7;
            }
            .grid {
                grid-template-columns: 1fr;
            }
            .topbar {
                align-items: stretch;
                flex-direction: column;
            }
            .actions button {
                flex: 1;
            }
            .output {
                min-height: 520px;
            }
        }
    </style>
</head>
<body>
    <div class="app">
        <section class="input-panel">
            <h1>剧情分镜提示词生成器</h1>
            <div class="subtitle">输入剧情概要，选择视频参数，生成可复制到 GPT 里继续给 image-2 出图的分镜脚本。</div>

            <div class="field">
                <label for="summary">剧情概要</label>
                <textarea id="summary" placeholder="自由编辑。写清楚角色、场景、冲突、情绪、结尾。例如：一个外卖员在暴雨夜送最后一单，发现收货人是多年未见的母亲，两人在门口短暂和解。"></textarea>
            </div>

            <div class="grid">
                <div class="field">
                    <label for="duration">时长</label>
                    <select id="duration"></select>
                </div>
                <div class="field">
                    <label for="ratio">视频横竖屏比例</label>
                    <select id="ratio">
                        <option value="9:16 竖屏短视频">9:16 竖屏短视频</option>
                        <option value="16:9 横屏视频">16:9 横屏视频</option>
                        <option value="1:1 方形视频">1:1 方形视频</option>
                        <option value="4:5 信息流竖图">4:5 信息流竖图</option>
                    </select>
                </div>
                <div class="field">
                    <label for="voiceover">是否需要配音</label>
                    <select id="voiceover">
                        <option value="需要配音">需要配音</option>
                        <option value="不需要配音">不需要配音</option>
                    </select>
                </div>
                <div class="field">
                    <label for="subtitles">是否需要字幕</label>
                    <select id="subtitles">
                        <option value="需要字幕">需要字幕</option>
                        <option value="不需要字幕">不需要字幕</option>
                    </select>
                </div>
            </div>

            <div class="actions">
                <button class="btn-primary" id="generateBtn">生成分镜提示词</button>
                <button class="btn-soft" id="sampleBtn">填入示例</button>
                <button class="btn-dark" id="clearBtn">清空</button>
            </div>
            <div class="status" id="status"></div>
        </section>

        <section class="output-panel">
            <div class="topbar">
                <div>
                    <h1>输出脚本</h1>
                    <div class="subtitle">包含人物设定、分段剧情、镜头语言、台词、音效、字幕和 image-2 出图提示词。</div>
                </div>
                <div class="actions">
                    <button class="btn-primary" id="copyBtn">复制</button>
                    <button class="btn-soft" id="downloadBtn">下载 TXT</button>
                </div>
            </div>
            <textarea class="output" id="output" spellcheck="false"></textarea>
        </section>
    </div>

    <script>
        const durationEl = document.getElementById('duration');
        const summaryEl = document.getElementById('summary');
        const outputEl = document.getElementById('output');
        const statusEl = document.getElementById('status');

        for (let seconds = 5; seconds <= 15; seconds++) {
            const option = document.createElement('option');
            option.value = String(seconds);
            option.textContent = `${seconds} 秒`;
            if (seconds === 10) option.selected = true;
            durationEl.appendChild(option);
        }

        function showStatus(text) {
            statusEl.textContent = text;
            clearTimeout(showStatus.timer);
            showStatus.timer = setTimeout(() => statusEl.textContent = '', 1800);
        }

        function splitIntoShots(duration) {
            if (duration <= 6) return 3;
            if (duration <= 9) return 4;
            if (duration <= 12) return 5;
            return 6;
        }

        function getShotPlan(count, duration) {
            const base = Math.floor(duration / count);
            let rest = duration % count;
            return Array.from({ length: count }, (_, index) => {
                const length = base + (rest > 0 ? 1 : 0);
                rest--;
                const start = index === 0 ? 0 : Array.from({ length: index }).reduce((sum, __, i) => {
                    const previousBase = Math.floor(duration / count);
                    return sum + previousBase + (i < duration % count ? 1 : 0);
                }, 0);
                return { index: index + 1, start, end: start + length, length };
            });
        }

        function buildShotDescription(index, count) {
            const presets = [
                ['建立场景', '用环境、天气、空间关系交代故事发生地，让观众一眼知道人物处境。', '远景或全景，稳定构图，主体进入画面。'],
                ['人物登场', '突出主角外貌、状态、标志物和当下情绪。', '中景到近景，轻微推进，视线落在人物表情。'],
                ['冲突出现', '呈现让剧情发生变化的动作、信息或对手。', '过肩镜头或侧面构图，制造压迫感。'],
                ['情绪转折', '让人物做出选择，画面要有明确动作和情绪变化。', '近景或特写，浅景深，强调眼神和手部动作。'],
                ['结果揭示', '给出结局画面或留下悬念，形成记忆点。', '特写或拉远，画面保留关键道具和情绪余韵。'],
                ['收束画面', '用一个安静但明确的画面结束故事。', '静态构图，留白，光线或环境声收尾。']
            ];
            if (count === 3) return [presets[0], presets[2], presets[4]][index - 1];
            if (count === 4) return [presets[0], presets[1], presets[3], presets[4]][index - 1];
            if (count === 5) return presets.slice(0, 5)[index - 1];
            return presets[index - 1];
        }

        function generatePrompt() {
            const summary = summaryEl.value.trim() || '请在这里补充剧情概要。';
            const duration = Number(durationEl.value);
            const ratio = document.getElementById('ratio').value;
            const voiceover = document.getElementById('voiceover').value;
            const subtitles = document.getElementById('subtitles').value;
            const shotCount = splitIntoShots(duration);
            const shotPlan = getShotPlan(shotCount, duration);
            const voiceLine = voiceover === '需要配音'
                ? '需要为每个镜头设计一句简短配音，语气贴合剧情，不要解释画面。'
                : '不需要配音，台词栏只保留人物现场对白；没有对白则写“无”。';
            const subtitleLine = subtitles === '需要字幕'
                ? '需要为每个镜头设计短字幕，字幕应口语化、适合短视频展示。'
                : '不需要字幕，字幕栏统一写“无”。';

            const shots = shotPlan.map((shot) => {
                const [title, plot, camera] = buildShotDescription(shot.index, shotCount);
                return [
                    `镜头 ${String(shot.index).padStart(2, '0')}｜${shot.start}-${shot.end} 秒｜${title}`,
                    `分段剧情描述：围绕剧情概要“${summary}”，完成本段任务：${plot}`,
                    `镜头语言：${camera}。画面比例：${ratio}。构图清晰，主体明确，动作可被一眼读懂。`,
                    `人物设定：延续同一批角色的年龄、发型、服装、道具、表情和性格，不随镜头变化。`,
                    `台词：根据剧情需要生成一句自然对白；如果此镜头不适合说话，写“无”。`,
                    `配音：${voiceover === '需要配音' ? '生成一句 8-18 字的旁白或心理独白。' : '无。'}`,
                    `音效：写出 1-3 个环境音或动作音，例如雨声、脚步声、门铃声、呼吸声。`,
                    `字幕：${subtitles === '需要字幕' ? '生成一句 6-16 字短字幕。' : '无。'}`,
                    `image-2 出图提示词：以这个镜头为单张画面生成提示词，包含主体、动作、环境、光线、情绪、景别、机位、构图、画面比例，不要把多个时间动作塞进同一张图。`
                ].join('\n');
            }).join('\n\n---\n\n');

            outputEl.value = [
                '请根据下面的信息，生成可用于 GPT 继续整理并调用 image-2 出图的剧情分镜脚本。',
                '',
                '【基础信息】',
                `剧情概要：${summary}`,
                `视频时长：${duration} 秒`,
                `视频比例：${ratio}`,
                `配音需求：${voiceover}`,
                `字幕需求：${subtitles}`,
                '',
                '【总体输出要求】',
                '1. 先提炼人物设定，包括主角、配角、服装、道具、表情状态、色彩关键词。',
                '2. 再按镜头输出分段剧情描述、镜头语言、台词、配音、音效、字幕。',
                '3. 每个镜头都要给出一条适合 image-2 的单图提示词。',
                '4. 保持人物、服装、场景、光线、画风一致。',
                '5. 不要添加剧情概要之外的新主线，不要让单张图片承担连续动作。',
                `6. ${voiceLine}`,
                `7. ${subtitleLine}`,
                '',
                '【人物设定】',
                '请从剧情概要中自动提炼人物。如果概要没有写清楚，请补足合理但简洁的人物外观设定，并在所有镜头中保持一致。',
                '',
                '【分镜脚本】',
                shots
            ].join('\n');
            showStatus(`已生成 ${shotCount} 个镜头`);
        }

        async function copyOutput() {
            try {
                await navigator.clipboard.writeText(outputEl.value);
                showStatus('已复制');
            } catch (error) {
                outputEl.select();
                document.execCommand('copy');
                showStatus('已复制');
            }
        }

        function loadSample() {
            summaryEl.value = '一个年轻女孩在深夜便利店躲雨，偶遇多年未联系的哥哥。两人一开始尴尬沉默，后来因为一盒热牛奶想起童年，关系慢慢缓和，最后哥哥把伞递给她，自己走进雨里。';
            durationEl.value = '12';
            document.getElementById('ratio').value = '9:16 竖屏短视频';
            document.getElementById('voiceover').value = '需要配音';
            document.getElementById('subtitles').value = '需要字幕';
            generatePrompt();
        }

        function clearAll() {
            summaryEl.value = '';
            durationEl.value = '10';
            document.getElementById('ratio').value = '9:16 竖屏短视频';
            document.getElementById('voiceover').value = '需要配音';
            document.getElementById('subtitles').value = '需要字幕';
            outputEl.value = '';
            showStatus('已清空');
        }

        function downloadOutput() {
            const blob = new Blob([outputEl.value], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'storyboard-image-2-prompt.txt';
            link.click();
            URL.revokeObjectURL(url);
        }

        document.getElementById('generateBtn').addEventListener('click', generatePrompt);
        document.getElementById('sampleBtn').addEventListener('click', loadSample);
        document.getElementById('clearBtn').addEventListener('click', clearAll);
        document.getElementById('copyBtn').addEventListener('click', copyOutput);
        document.getElementById('downloadBtn').addEventListener('click', downloadOutput);

        generatePrompt();
    </script>
</body>
</html>
