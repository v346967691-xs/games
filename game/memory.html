<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>记忆翻牌</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: system-ui, sans-serif;
        }
        .container { text-align: center; padding: 32px 16px; }
        .title {
            color: #c9a96e;
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 30px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }
        .info {
            color: #b8bdc8;
            font-size: 16px;
            margin-bottom: 20px;
        }
        .info span { color: #c9a96e; font-weight: bold; }
        .board {
            display: grid;
            grid-template-columns: repeat(4, 90px);
            gap: 12px;
            justify-content: center;
        }
        .card {
            width: 90px;
            height: 120px;
            background: linear-gradient(145deg, #d0d5dc, #b8bcc4);
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            transition: transform 0.3s, background 0.3s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            border: 3px solid transparent;
        }
        .card:hover { transform: scale(1.05); }
        .card.flipped {
            background: linear-gradient(145deg, #e8d4b8, #d4c4a8);
            border-color: #b8a080;
        }
        .card.matched {
            background: linear-gradient(145deg, #a8c8b0, #8cb898);
            border-color: #6a9870;
            cursor: default;
        }
        .card .icon { display: none; }
        .card.flipped .icon,
        .card.matched .icon { display: block; }
        .card .back { display: block; }
        .card.flipped .back,
        .card.matched .back { display: none; }
        .btn-reset {
            margin-top: 30px;
            padding: 12px 40px;
            font-size: 16px;
            font-weight: bold;
            background: #34495e;
            color: #fff;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-reset:hover { background: #4a6a8e; }
        @media (max-width: 430px) {
            .board {
                grid-template-columns: repeat(4, 72px);
                gap: 8px;
            }
            .card {
                width: 72px;
                height: 96px;
                font-size: 40px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">记忆翻牌</div>
        <div class="info">用时：<span id="time">0</span> 秒　　步数：<span id="steps">0</span></div>
        <div class="board" id="board"></div>
        <button class="btn-reset" onclick="init()">重新开始</button>
    </div>

    <script>
        const icons = ['🍎', '🍌', '🍇', '🍓', '🍉', '🍒', '🥝', '🍑'];
        let cards = [];
        let flipped = [];
        let matched = 0;
        let steps = 0;
        let timer = 0;
        let interval = null;
        let locked = false;

        function shuffle(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function init() {
            clearInterval(interval);
            matched = 0;
            steps = 0;
            timer = 0;
            flipped = [];
            locked = false;
            document.getElementById('steps').textContent = '0';
            document.getElementById('time').textContent = '0';

            cards = shuffle([...icons, ...icons]);
            document.getElementById('board').innerHTML = cards.map((icon, index) => `
                <div class="card" data-index="${index}">
                    <span class="icon">${icon}</span>
                    <span class="back">?</span>
                </div>
            `).join('');

            document.querySelectorAll('.card').forEach((card) => {
                card.addEventListener('click', () => flip(card));
            });

            interval = setInterval(() => {
                timer++;
                document.getElementById('time').textContent = timer;
            }, 1000);
        }

        function flip(card) {
            if (locked || card.classList.contains('flipped') || card.classList.contains('matched')) return;
            card.classList.add('flipped');
            flipped.push(card);

            if (flipped.length !== 2) return;
            steps++;
            document.getElementById('steps').textContent = steps;
            locked = true;

            const [first, second] = flipped;
            const firstIcon = cards[first.dataset.index];
            const secondIcon = cards[second.dataset.index];

            if (firstIcon === secondIcon) {
                first.classList.add('matched');
                second.classList.add('matched');
                matched++;
                flipped = [];
                locked = false;

                if (matched === icons.length) {
                    clearInterval(interval);
                    setTimeout(() => alert(`完成！用时 ${timer} 秒，步数 ${steps}`), 300);
                }
                return;
            }

            setTimeout(() => {
                first.classList.remove('flipped');
                second.classList.remove('flipped');
                flipped = [];
                locked = false;
            }, 800);
        }

        init();
    </script>
</body>
</html>
